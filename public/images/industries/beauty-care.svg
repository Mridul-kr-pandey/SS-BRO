    <rect x="0" y="0" width="160" height="24" fill="#F472B6"/>
    <circle cx="80" cy="12" r="4" fill="#FFFFFF"/>
    
    <!-- Sector specific motif on pouch -->
    
      <!-- Cosmetic Dropper / Sleek Bottle Silhouette -->
