<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="pgrad_stand-up-zipper" x1="80" y1="40" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="pShadow_stand-up-zipper" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#070D18" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Subtle Technical Background Card -->
  <rect width="400" height="320" rx="8" fill="#F8FAFC"/>
  <rect x="12" y="12" width="376" height="296" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Pouch Illustration by Type -->
  
    <!-- Stand-Up Pouch with Zipper -->
    <g filter="url(#pShadow_stand-up-zipper)">
      <!-- Pouch Body with Bottom Gusset Flares -->
      <path d="M140 50 L260 50 L285 240 C285 255, 260 265, 200 265 C140 265, 115 255, 115 240 Z" fill="url(#pgrad_stand-up-zipper)"/>
      <!-- Top Seal & Hang Hole -->
      <path d="M140 50 L260 50 L260 75 L140 75 Z" fill="#E06D28"/>
      <ellipse cx="200" cy="62" rx="6" ry="3.5" fill="#FFFFFF"/>
      <!-- Zipper Track -->
      <line x1="142" y1="90" x2="258" y2="90" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2"/>
      <!-- Bottom Gusset Fold Crease -->
      <path d="M120 238 C155 252, 245 252, 280 238" stroke="#E06D28" stroke-width="2" fill="none"/>
      <!-- Showcase Window / Graphic -->
      <rect x="150" y="115" width="100" height="90" rx="6" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="200" cy="150" r="14" fill="#E06D28" opacity="0.9"/>
      <rect x="168" y="180" width="64" height="5" rx="2" fill="#1E293B"/>
    </g>
  

  <!-- Subtle Badge indicator in corner -->
  <g transform="translate(24, 24)">
    <circle cx="12" cy="12" r="10" fill="#E06D28" opacity="0.12"/>
    <path d="M8 12L11 15L16 9" stroke="#E06D28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>