<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="pgrad_two-side-gusset" x1="80" y1="40" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="pShadow_two-side-gusset" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#070D18" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Subtle Technical Background Card -->
  <rect width="400" height="320" rx="8" fill="#F8FAFC"/>
  <rect x="12" y="12" width="376" height="296" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Pouch Illustration by Type -->
  
    <!-- 2-Side Gusset Pouch -->
    <g filter="url(#pShadow_two-side-gusset)">
      <!-- Main Face -->
      <rect x="145" y="50" width="110" height="215" fill="url(#pgrad_two-side-gusset)"/>
      <!-- Left Expandable Pleat Gusset -->
      <polygon points="120,65 145,50 145,265 120,255" fill="#7C2D12" opacity="0.85"/>
      <line x1="132" y1="58" x2="132" y2="260" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 2"/>
      <!-- Right Expandable Pleat Gusset -->
      <polygon points="255,50 280,65 280,255 255,265" fill="#C2410C" opacity="0.85"/>
      <line x1="268" y1="58" x2="268" y2="260" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 2"/>
      <!-- Top Fold Seal -->
      <rect x="140" y="45" width="120" height="15" fill="#EA580C"/>
      <!-- Front Brand Panel -->
      <rect x="155" y="95" width="90" height="100" rx="3" fill="#FFFFFF" opacity="0.95"/>
      <rect x="170" y="115" width="60" height="7" rx="2" fill="#7C2D12"/>
      <line x1="170" y1="135" x2="230" y2="135" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="170" y1="150" x2="210" y2="150" stroke="#94A3B8" stroke-width="2"/>
    </g>
  

  <!-- Subtle Badge indicator in corner -->
  <g transform="translate(24, 24)">
    <circle cx="12" cy="12" r="10" fill="#EA580C" opacity="0.12"/>
    <path d="M8 12L11 15L16 9" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>